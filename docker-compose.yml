services:

  redis:
    image: redis:latest
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6204:6379"
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: TemporaryRoot123!
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "6206:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: Mock-WS-MINIO
      MINIO_ROOT_PASSWORD: Mock-WS-MINIO-PASS
    ports:
      - "6208:9000"
      - "6209:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      Mock-WS-MINIO
      Mock-WS-MINIO-PASS;
      do
        sleep 2;
      done;
      mc mb --ignore-existing local/profile-photos;
      exit 0;
      "

  mock-websocket:
    build:
      context: .
      dockerfile: Dockerfile
    command: python workers/mock_websocket_server.py
    ports:
      - "8765:8765"

  worker-a:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "workers.worker_a"]
    depends_on:
      - redis
      - mock-websocket

  worker-b:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "workers.worker_b"] 
    depends_on:
      - redis
      - mysql

  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python django_app/manage.py runserver 0.0.0.0:6280
    ports:
      - "6280:6280"
    depends_on:
      - mysql
      - minio

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 6288
    ports:
      - "6288:6288"
    depends_on:
      - mysql
      - minio
      - redis

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - fastapi

volumes:
  redis_data:
  mysql_data:
  minio_data: